[project]
name = "pfx"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = ["pydantic[email]>=2.9", "pydantic-settings>=2.6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "mypy>=2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "ANN"]
ignore = ["ANN401"]
[tool.ruff.lint.per-file-ignores]
# @gen bodies are left unannotated so pyright infers Effect[A, E, R]; annotate with pfx.Do[...] instead
# if the repo also runs mypy (mypy cannot infer generator types).
"examples/*" = ["ANN201", "ANN202"]
"tests/*" = ["ANN201", "ANN202"]
# Layer needs an explicitly INVARIANT ROut; PEP 695 syntax would infer it covariant (unsound).
"src/pfx/layer.py" = ["UP046"]
"src/pfx/core.py" = ["UP046"]  # same reason: explicit covariance for mypy

[tool.pyright]
include = ["src", "examples", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
# unannotated generators get send-type Unknown (pyright#10279); @gen never uses it
reportUnknownParameterType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
